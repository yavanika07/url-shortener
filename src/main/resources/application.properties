spring.application.name=url-shortener
server.port=8080

# Public address that short links are built from
app.base-url=${APP_BASE_URL:http://localhost:8080}

# PostgreSQL (override with environment variables, e.g. in docker-compose)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/urlshortener}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
